services:
  ros2-edu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ros2-gazebo-edu:jazzy
    container_name: ros2-gazebo-edu
    ports:
      # Host port 6902, not the base image's default 6901, so this stack
      # can run at the same time as another noVNC container (the Scilab
      # GNC workspace uses 6901). Only the HOST side moves: inside the
      # container noVNC still listens on 6901.
      #
      # Override without editing this file if 6902 is also taken:
      #   NOVNC_PORT=6910 docker compose -f docker/docker-compose.yml up -d
      - "${NOVNC_PORT:-6902}:6901"   # noVNC web client -> http://localhost:6902
      - "${VNC_PORT:-5902}:5901"     # raw VNC client (optional, native viewer)
    environment:
      - VNC_PW=ros2edu
      - VNC_RESOLUTION=1600x900
    volumes:
      # The whole workspace is bind-mounted, so edits made on the host in
      # VS Code appear instantly inside the container and survive a
      # `docker compose down`. Students never lose work to a container.
      - ..:/workspace
    # Gazebo's rendering and transport layers use shared memory heavily;
    # Docker's 64MB default causes intermittent crashes on world load.
    # 1gb is ample for these worlds and leaves more for the host -- on a
    # 16GB laptop the old 2gb reservation was a meaningful slice of what
    # WSL2 had to play with.
    shm_size: "1gb"

    # Hard caps, so a runaway simulation degrades instead of dragging
    # Windows into swap. Gazebo's software renderer will use every core
    # it is offered and starve the browser tab that is drawing noVNC.
    #
    # These complement ~/.wslconfig rather than replace it: .wslconfig
    # caps the whole WSL2 VM, this caps the container inside it. You want
    # both, and the container limit must be the smaller of the two.
    mem_limit: 6g
    cpus: 6.0
    # No `command:` on purpose -- the container runs the base image's
    # desktop startup and stays up. The colcon build is done afterwards
    # by up.sh, because startup.sh waits on its `vncserver` launcher PID:
    # that launcher forks the real Xvnc and exits immediately, so a long
    # startup command outlives it and triggers cleanup(), tearing the
    # desktop down.
