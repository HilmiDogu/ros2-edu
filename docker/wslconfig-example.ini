# WSL2 resource limits for Windows users -- RECOMMENDED.
#
# Copy this to your user folder as ".wslconfig" (note the leading dot):
#
#   copy docker\wslconfig-example.ini %USERPROFILE%\.wslconfig
#
# then apply it. The file is only read when the VM starts, so this step
# is not optional:
#
#   wsl --shutdown
#
# and restart Docker Desktop.
#
# WHY THIS MATTERS
#
# On Windows, Docker runs inside a WSL2 virtual machine -- the process
# Task Manager shows as "vmmemWSL". Without this file WSL2 may claim up
# to HALF the host's RAM and never hand it back. Gazebo renders in
# software here (no GPU passthrough), so it is memory- and CPU-hungry;
# once the VM reaches that ceiling Windows starts swapping and the whole
# VM stalls. The symptom is noVNC freezing mid-simulation, which looks
# like the simulation crashed rather than the host running out of room.
#
# The numbers below suit a 16 GB / 12-core laptop. On a smaller machine
# scale both down: memory=6GB and processors=4 still runs the classroom
# world, though Moon and Mars will be slower.

[wsl2]
# Hard cap on VM memory. Roughly half the host's RAM, leaving the rest
# for Windows, a browser and an editor.
memory=8GB

# Leave cores for the host. Gazebo's software renderer will saturate
# every core it is given -- including the ones drawing your noVNC tab.
processors=8

# Swap inside the VM, so a spike degrades instead of killing processes.
swap=4GB

# Return freed memory to Windows rather than holding it. This is the
# setting that stops vmmemWSL growing steadily across a long session.
autoMemoryReclaim=gradual

# Release cached disk pages back to the host as well.
pageReporting=true

# Do not hold host resources open while the VM is idle.
vmIdleTimeout=60000
