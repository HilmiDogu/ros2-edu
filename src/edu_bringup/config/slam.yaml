# slam_toolbox configuration for the EduBot.
#
# These are the stock settings with the frame names and a few tuning
# values adjusted for this robot. The parameters worth understanding as a
# student are commented; the rest are slam_toolbox defaults and are
# included so the file is complete and self-contained.
slam_toolbox:
  ros__parameters:

    # --- Frames -----------------------------------------------------
    # This is the part you must get right for your own robot. SLAM
    # publishes the map -> odom transform; the simulation already
    # publishes odom -> base_link. Together they answer "where is the
    # robot in the map?".
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_sim_time: true

    # mapping builds a new map; localization loads a saved one.
    mode: mapping

    # --- Solver -----------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0

    # How far the lidar readings are trusted. The EduBot's lidar has a
    # 10 m range; setting this beyond the sensor's real maximum invents
    # map detail that was never measured.
    max_laser_range: 10.0

    resolution: 0.05          # metres per map cell
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # --- When to process a new scan ---------------------------------
    # A new scan is only processed once the robot has moved this far, so
    # a stationary robot does not pile up redundant data. Lower values
    # give a denser map at more CPU cost.
    minimum_travel_distance: 0.3   # metres
    minimum_travel_heading: 0.3    # radians

    # --- Loop closure ------------------------------------------------
    # The mechanism that corrects accumulated drift when the robot
    # revisits a known place.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # --- Scan matching ------------------------------------------------
    use_scan_matching: true
    use_scan_barycenter: true
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
