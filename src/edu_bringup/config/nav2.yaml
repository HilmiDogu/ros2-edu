# Nav2 configuration for the six-wheel "rover" in this workspace.
#
# This is nav2_bringup's stock nav2_params.yaml, cut down and retuned for
# THIS robot and THESE open heightmap worlds. The values a student should
# understand are commented; the rest are Nav2 defaults, kept so the file
# is complete and self-contained.
#
# Three facts about the rover drove most of the tuning:
#   * Its DiffDrive plugin is velocity-capped at 0.6 m/s linear and
#     1.0 rad/s angular. Nav2's commanded velocities MUST stay at or below
#     those caps, or Gazebo silently clips the command and the controller
#     thinks it is driving faster than it is. So max_vel_x 0.5,
#     max_vel_theta 0.8 here.
#   * The /cmd_vel bridge into Gazebo expects an UNSTAMPED
#     geometry_msgs/Twist. Nav2 Jazzy publishes TwistStamped by default,
#     which the bridge would silently drop -- the robot would plan but
#     never move. Every node that writes /cmd_vel therefore sets
#     enable_stamped_cmd_vel: false.
#   * The worlds are open 40x40 m terrain with no walls and only sparse
#     rocks/craters, and the SLAM map stays mostly "unknown". So the
#     global costmap is a ROLLING window centred on the robot (there are
#     no boundaries to size a static global map against) and the planner
#     is allowed to route through unknown space.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    # Emit plain geometry_msgs/Twist on /cmd_vel -- the Gazebo bridge in
    # this workspace does not accept TwistStamped (see file header).
    enable_stamped_cmd_vel: false
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # Regulated Pure Pursuit: the simplest robust controller for a
    # differential / skid-steer drive. It follows the planned path,
    # slowing down for tight curves and near obstacles. No sideways
    # (vy) motion, which matches a skid-steer rover.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5          # <= 0.6 m/s cap
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8   # <= 1.0 rad/s cap
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # This rover cannot strafe, so it must first spin to face the path.
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.5
      max_robot_pose_search_dist: 10.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # The SLAM map of an open world is mostly "unknown" -- without this
      # the planner refuses to route anywhere it has not yet mapped and
      # most goals fail. Allowing unknown space lets the rover head toward
      # goals in the open terrain and map as it goes.
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    # Recovery behaviours also drive the wheels, so they too must emit
    # unstamped Twist on /cmd_vel.
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Keep recovery rotation within the rover's 1.0 rad/s cap.
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.5

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      # Pause briefly at each waypoint so the queue is visibly stepped
      # through (milliseconds).
      waypoint_pause_duration: 500

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Rover body ~0.6 x 0.4 m over a ~0.48 m track / ~0.44 m wheelbase;
      # a 0.45 m circle encloses the whole thing with a little margin.
      robot_radius: 0.45
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
      # 2-D laser only: use ObstacleLayer, not VoxelLayer. The lidar scans
      # a single plane, so there is no 3-D volume to voxelise.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # The lidar has a 10 m max range.
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 9.0
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.45
      resolution: 0.1
      # The worlds have no walls to bound a fixed global map, so the
      # global costmap is a rolling window that follows the robot. 20 m
      # square comfortably spans twice the 10 m lidar range, so every
      # obstacle the rover can see fits inside the costmap it plans on.
      rolling_window: true
      width: 20
      height: 20
      # Route through not-yet-seen terrain (the open world is mostly
      # unknown) rather than treating unknown as blocked.
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 9.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
      always_send_full_costmap: True
